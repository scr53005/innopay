<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RUBIS">
  <title>RUBIS</title>
  <!-- Brilliant-cut ruby, face-up (2026-11-03 redraw): flat table on top, 5 crown facets,
       girdle, 3 pavilion facets meeting at the culet. Light from the top-left.
       Few, large facets so the cut still reads at 12–16px. -->
  <defs>
    <linearGradient id="rb-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f9c"/>
      <stop offset="1" stop-color="#e8233d"/>
    </linearGradient>
    <linearGradient id="rb-heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e01e37"/>
      <stop offset="1" stop-color="#7a0c16"/>
    </linearGradient>
  </defs>
  <!-- the stone, turned 35° clockwise like rubis-295x295.png and scaled to stay inside the box -->
  <g transform="translate(32 33) rotate(35) scale(.86) translate(-32 -34)">
  <!-- crown -->
  <path d="M4 22 L16 8 L24 22 Z" fill="#ff5a6e"/>
  <path d="M16 8 L32 8 L24 22 Z" fill="#ffb3bc"/>
  <path d="M24 22 L32 8 L40 22 Z" fill="url(#rb-table)"/>
  <path d="M32 8 L48 8 L40 22 Z" fill="#ff7486"/>
  <path d="M40 22 L48 8 L60 22 Z" fill="#d3132c"/>
  <!-- pavilion -->
  <path d="M4 22 L24 22 L32 60 Z" fill="#c4122a"/>
  <path d="M24 22 L40 22 L32 60 Z" fill="url(#rb-heart)"/>
  <path d="M40 22 L60 22 L32 60 Z" fill="#8e0d1e"/>
  <path d="M24 22 L28.5 22 L32 60 Z" fill="#ff6b7d" opacity=".55"/>
  <!-- facet edges -->
  <path d="M16 8 L32 8 M4 22 H60 M16 8 L24 22 L32 8 L40 22 L48 8 M24 22 L32 60 L40 22" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".9" stroke-linejoin="round"/>
  <!-- polish: specular highlight and a soft reflection in the pavilion -->
  <path d="M18.5 10 L29 10 L24 18.5 Z" fill="#fff" opacity=".55"/>
  <path d="M10 22 L22 22 L29 48 Z" fill="#fff" opacity=".12"/>
  <!-- outline -->
  <path d="M16 8 H48 L60 22 L32 60 L4 22 Z" fill="none" stroke="#5c0a12" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <!-- glint -->
  <path d="M52 3 l1.3 3.6 3.6 1.3 -3.6 1.3 -1.3 3.6 -1.3 -3.6 -3.6 -1.3 3.6 -1.3 z" fill="#fff"/>
</svg>
