<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RUBIS">
  <title>RUBIS</title>
  <!-- Vector redraw of rubis-295x295.png: tilted faceted ruby, crown up-left, culet down-right.
       Facets fan out from one inner point so the gem still reads at 16px. -->
  <defs>
    <linearGradient id="rb-table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b7d"/>
      <stop offset="1" stop-color="#e01e37"/>
    </linearGradient>
    <linearGradient id="rb-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a4161a"/>
      <stop offset="1" stop-color="#5c0a12"/>
    </linearGradient>
  </defs>
  <!-- outline / base -->
  <path d="M3 14 L37 4 L45 11 L61 31 L60 49 L50 59 L16 53 L5 35 Z" fill="#7a0c16"/>
  <!-- crown facets (lit, upper-left) -->
  <path d="M3 14 L37 4 L24 20 Z" fill="#ff4d61"/>
  <path d="M37 4 L45 11 L34 21 L24 20 Z" fill="#ff8a98"/>
  <path d="M3 14 L24 20 L15 33 L5 35 Z" fill="#e5383b"/>
  <!-- table -->
  <path d="M24 20 L34 21 L37 32 L22 34 L15 33 Z" fill="url(#rb-table)"/>
  <!-- right side -->
  <path d="M45 11 L61 31 L37 32 L34 21 Z" fill="#d00f26"/>
  <path d="M61 31 L60 49 L37 32 Z" fill="#9d0b1c"/>
  <!-- pavilion (shadowed, lower-right) -->
  <path d="M60 49 L50 59 L37 32 Z" fill="url(#rb-deep)"/>
  <path d="M50 59 L16 53 L22 34 L37 32 Z" fill="#b5121b"/>
  <path d="M16 53 L5 35 L15 33 L22 34 Z" fill="#8a0f18"/>
  <!-- inner glints -->
  <path d="M37 32 L50 59 L42 40 Z" fill="#ff5c70" opacity=".55"/>
  <path d="M22 34 L16 53 L27 41 Z" fill="#ff7083" opacity=".45"/>
  <!-- specular highlight + sparkle -->
  <path d="M38 8 L43 12 L36 18 Z" fill="#fff" opacity=".75"/>
  <path d="M27 22 L32 22.6 L25.5 28 Z" fill="#fff" opacity=".55"/>
  <path d="M52 22 l1.2 3.3 3.3 1.2 -3.3 1.2 -1.2 3.3 -1.2 -3.3 -3.3 -1.2 3.3 -1.2 z" fill="#fff" opacity=".9"/>
  <!-- crisp edge -->
  <path d="M3 14 L37 4 L45 11 L61 31 L60 49 L50 59 L16 53 L5 35 Z" fill="none" stroke="#4a050c" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
